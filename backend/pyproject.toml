[project]
name = "backend"
version = "0.1.0"
description = "Brand Mentions API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "aiosqlite==0.20.0",
    "pydantic>=2.11",
    "returns>=0.29.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "returns[compatible-mypy]>=0.29.0",
]

[tool.mypy]
plugins = ["returns.contrib.mypy.returns_plugin"]
